# Longer CUDA exploration run for alphaR-target committor convergence studies.
#
# Suggested manual run:
#   trails-md --config examples/alanine_dipeptide/config_cuda_alphaR_convergence.yaml \
#     --iterations 50 --log-level INFO
#
# Then analyze:
#   python examples/alanine_dipeptide/analyze_alphaR_committor_convergence.py \
#     --run-dir examples/alanine_dipeptide/runs/alanine_dipeptide_alphaR_convergence

system:
  conf_file: structure.pdb
  top_file: structure.pdb
  topology: amber
  system_file: system.py
  project_file: project_phi_psi.py
  trajectory_topology_file: structure.pdb
  feature_selection: "protein and not (type H)"

engine:
  md_engine: openmm
  platform_name: CUDA
  precision: mixed
  gpu_ids: [0]
  temperature: 300.0
  dt: 0.002
  npt: false

spawning:
  spawn_scheme: density
  spawn_type: hard
  search_mode: explore
  walker: 8
  step: 2000
  stride: 100
  max_workers: 1
  recent_density_window: 0
  resolution_check_patience: 10

space_mode: fixed
n_bins: [24, 24]
min_values: [-3.141592653589793, -3.141592653589793]
max_values: [3.141592653589793, 3.141592653589793]

outdir: runs/alanine_dipeptide_alphaR_convergence
random_seed: 42
checkpoint_freq: 5
save_features: false
