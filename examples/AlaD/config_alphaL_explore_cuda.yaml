# Explicit-water alanine-dipeptide exploration run for alphaL committor checks.
#
# Run:
#   trails-md --config examples/AlaD/config_alphaL_explore_cuda.yaml \
#     --iterations 150 --log-level INFO
#
# Analyze:
#   python examples/alanine_dipeptide/analyze_alphaR_committor_convergence.py \
#     --run-dir examples/AlaD/runs/alad_alphaL_explore_36x36 \
#     --target alphaL --local-grid-size 36 --n-microstates 100

system:
  conf_file: start.gro
  top_file: topol.top
  topology: gromacs
  project_file: project_phi_psi.py
  trajectory_topology_file: start.gro
  feature_selection: "protein and not (type H)"

engine:
  md_engine: openmm
  platform_name: CUDA
  gromacs_executable: gmx
  gromacs_include_dir: /home/dm/Soft/GMX26/share/gromacs/top
  temperature: 300.0
  pressure: 1.0
  dt: 0.002
  npt: true
  equilibrate: false

spawning:
  spawn_scheme: density
  voronoi_clusters: 1500
  spawn_type: hard
  search_mode: explore
  walker: 16
  step: 1000
  stride: 50
  max_workers: 1
  recent_density_window: 0
  resolution_check_patience: 0

space_mode: fixed
n_bins: [36, 36]
min_values: [-3.141592653589793, -3.141592653589793]
max_values: [3.141592653589793, 3.141592653589793]
outdir: runs/alad_alphaL_explore_36x36
random_seed: 4242
checkpoint_freq: 5
save_features: false
